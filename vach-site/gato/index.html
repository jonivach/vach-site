<style>
/* Layout: una columna tipo app de celular, centrada; paleta VACH* sobre crema (un solo tema, elegido) */
:root{
  --bg:#F8F7EC; --card:#FFFEF8; --tile:#EEECDD; --ink:#0A0A0A; --muted:#66655C; --soft:#3D3C36; --line:rgba(10,10,10,.12);
  --fish:#F5C800; --cat:#7B4FFF; --cat-bg:#EAE3FF; --ray:#E4DEF5; --good:#0E9A7C; --bad:#D9432C; --bad-bg:#FBE1DB;
  --f:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --night:#0A0A0A; --on-night:#F8F7EC;
  color-scheme:light;
}
/* modo oscuro (se prende desde Ajustes) */
html.dark{
  --bg:#151513; --card:#201F1C; --tile:#2C2B27; --ink:#F3F1E6; --muted:#A6A497; --soft:#D6D4C7; --line:rgba(255,255,255,.13);
  --cat:#9A7BFF; --cat-bg:#2F2854; --ray:#3C3368; --good:#33C29E; --bad:#F06A52; --bad-bg:#4A241D;
  --night:#2C2B27; --on-night:#F3F1E6;
  color-scheme:dark;
}
html.dark .sw:not(:checked){background:#4A4943}html.dark .sw::after{background:#F3F1E6}
html.dark .grab,html.dark .dots i{background:#4A4943}
html.dark .dots i.on{background:var(--ink)}
/* superficies amarillas: siempre texto oscuro */
html.dark :is(.daily,.pill.yellow,.stage-end,[style*="background:var(--fish)"]){--ink:#0A0A0A;--bg:#F8F7EC;--card:#FFFEF8;--tile:#EEECDD;--muted:#4F4C3A;--soft:#2E2D28;--line:rgba(10,10,10,.14);--night:#0A0A0A;--on-night:#F8F7EC;color:#0A0A0A}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
a{color:inherit}
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.view{display:flex;flex-direction:column;gap:16px;padding-block:20px 28px;flex:1}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:12px;min-height:44px}
.top h1{font-size:26px;letter-spacing:-.03em}
.round{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none;cursor:pointer;padding:0}
.round svg{width:18px;height:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:999px;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:0 20px;width:100%}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:999px;padding:5px 10px;background:var(--card);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.liar{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.full{color:var(--good);border-color:var(--good)}
.pill.yellow{background:var(--fish);border:1.5px solid var(--ink)}
:focus-visible{outline:3px solid var(--cat);outline-offset:2px}
.muted{color:var(--muted)}
.center{text-align:center}
.stack{display:flex;flex-direction:column;gap:10px}
.mt-auto{margin-top:auto}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.list>*{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;min-height:58px;border:0;border-bottom:1px solid rgba(10,10,10,.08);background:none;text-align:left;width:100%;cursor:pointer;font-size:16px;font-weight:600;text-decoration:none}
.list>*:last-child{border-bottom:0}
.sw{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:999px;background:#D6D3C4;position:relative;margin:0;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--card);transition:left .15s}
.sw:checked{background:var(--good)}.sw:checked::after{left:23px}

/* Inicio */
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:-.03em}
.minib{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:200px;align-self:center}
.minib span{aspect-ratio:1;border-radius:8px;background:var(--tile);display:grid;place-items:center}
.minib span.c{background:var(--cat-bg)}
.bar{height:8px;border-radius:999px;background:var(--tile);overflow:hidden}
.bar i{display:block;height:100%;background:var(--cat);border-radius:999px}
.daily{background:var(--fish);border-radius:24px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.streak{display:flex;flex-direction:column;align-items:center;background:var(--night);color:var(--on-night);border-radius:14px;padding:8px 12px;flex:none}
.streak b{font-size:22px;line-height:1}.streak small{font-size:11px;font-weight:600}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;min-height:70px;padding:10px 6px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none}
.tile-btn svg{width:22px;height:22px}
.tile-btn.off{background:var(--tile);border-color:transparent;color:#8A887C;cursor:default}
.tile-btn small{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Juego */
.supply{display:flex;flex-direction:column;align-items:center;gap:4px}
.supply .row{justify-content:center;flex-wrap:wrap;gap:8px}
.supply strong{font-size:18px}
.fishrow{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.fishrow svg{width:40px;height:24px;transition:filter .2s,opacity .2s,transform .2s}
.fishrow svg.used{filter:grayscale(1);opacity:.3;transform:scale(.88)}
.reward{font-size:13px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.reward b{color:var(--ink)}
.board-wrap{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px}
.board{display:grid;gap:5px;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cell{position:relative;aspect-ratio:1;border:0;border-radius:9px;background:var(--tile);padding:0;cursor:pointer;display:grid;place-items:center;transition:background .12s,transform .08s}
.cell:active{transform:scale(.95)}
.cell.seen,.cell.ray{background:var(--ray)}
.cell .fish{width:72%}
.cell .x{width:34%}
.cell.lock{box-shadow:inset 0 0 0 2px var(--good)}
.cell.cat{background:var(--cat-bg)}
.cell.cat .face{position:absolute;left:9%;top:8%;width:46%}
.cell.cat .clue{position:absolute;right:8%;bottom:5%;display:flex;align-items:center;gap:1px;font-weight:700;line-height:1;font-size:var(--clue,18px)}
.cell.cat .clue svg{width:calc(var(--clue,18px)*.8);height:calc(var(--clue,18px)*.8)}
.cell.cat .crown{position:absolute;right:7%;top:6%;width:34%}
.cell.cat.ok .clue{color:var(--good)}
.cell.cat.over .clue{color:var(--bad)}
.cell.cat.hov{box-shadow:inset 0 0 0 3px var(--cat)}
.cell.cat.acc{background:var(--bad-bg);box-shadow:inset 0 0 0 3px var(--bad)}
.cell.cat.acc .face path{fill:var(--bad)}
.cell.cat.acc .clue{color:var(--bad)}
.cell.cat.acc::before{content:"¡Miente!";position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;background:var(--bad);color:var(--card);border-radius:999px;padding:2px 6px;white-space:nowrap;z-index:2}
.cell.hint{animation:pulse 1.1s ease-in-out 3}
.cell.shake{animation:shake .4s}
@keyframes pulse{50%{box-shadow:inset 0 0 0 4px var(--good)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.status{min-height:22px;text-align:center;font-size:15px;font-weight:600;color:var(--muted)}
.status.ok{color:var(--good)}.status.warn{color:var(--bad)}.status.info{color:var(--cat)}
.controls{display:flex;gap:8px}
.controls .ctl{flex:1 1 0;min-width:0;min-height:50px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:700;cursor:pointer}
.controls .tool{flex:0 0 52px;display:grid;place-items:center;padding:0}
.controls .tool svg{width:22px;height:22px}
.controls .tool[aria-pressed="true"]{background:var(--fish);border-color:var(--ink)}
.dailybar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:18px;padding:12px 16px}
.dailybar b{font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* Victoria y resultados */
.hero{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:8px}
.hero h1{font-size:38px;letter-spacing:-.04em;line-height:1}
.stars{display:flex;gap:10px}
.stars svg{width:46px;height:46px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.album{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.acard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.acard .art{width:84px;height:84px;border-radius:50%;background:var(--cat-bg);display:grid;place-items:center;margin-bottom:4px}
.acard.off .art{background:var(--tile)}
.acard b{font-size:15px}.acard span:last-child{font-size:12px;color:var(--muted);line-height:1.35}
.acard.off b{color:var(--muted)}
.newcat{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:2px solid var(--cat);border-radius:20px;padding:12px 14px;cursor:pointer;font:inherit;color:inherit;animation:pop .4s ease-out both}
.newcat .art{width:76px;height:76px;border-radius:50%;background:var(--cat-bg);display:grid;place-items:center;flex:none}
#pushState{background:var(--good);color:#fff;border-color:transparent}#pushState.off{background:var(--card);color:var(--muted);border-color:var(--line)}
.askcard{display:flex;flex-direction:column;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.weekly{background:var(--night);color:var(--on-night);border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px;border:0;width:100%;font:inherit;cursor:pointer}
div.weekly{cursor:default}
.homecard{border-radius:24px;padding:18px 18px 16px;gap:14px}
main.home{gap:14px}
.shieldmini{font-size:11px;margin-left:3px;vertical-align:3px}
main.min{gap:0}
main.min .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding-block:12px}
main.min h1{font-size:34px;letter-spacing:-.03em;line-height:1.05;max-width:16ch}
main.min .line{font-size:16px;color:var(--muted);line-height:1.4;margin:0}
main.min .line b{color:var(--ink)}
main.min .line.small{font-size:14px}
main.min .bigtime{font-size:68px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;font:inherit;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer}
.chip i{width:34px;height:34px;border-radius:50%;background:var(--cat-bg);display:grid;place-items:center;font-style:normal}
.linkbtn.big{font-size:15px;align-self:center;padding:14px 4px 2px}
.linkrow{display:flex;justify-content:center;gap:22px}
.pushline{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px}
.pushline .linkbtn{padding:4px 8px;color:var(--cat)}
.result h1{font-size:30px;line-height:1.05}
.result .stat{padding:10px 14px}
.result .newcat{padding:10px 12px}.result .newcat .art{width:60px;height:60px}
@media (max-height:760px){.result{padding-block:12px 14px;gap:10px!important}.result .hero{gap:8px}.result h1{font-size:26px}
  .result .week i{width:30px;height:30px}.result .week div{gap:2px}.result .rank{padding:8px 12px;font-size:14px}.result .stat b{font-size:24px}.result .subnote{display:none}
  .stage-end .hero>div:first-child{width:84px!important;height:84px!important}.stage-end .hero>div:first-child svg{width:54px;height:54px}.result .btn{min-height:46px}}
@media (max-height:620px){.result .week{display:none}.resbtns{flex-direction:row!important}.resbtns>*{flex:1}.resbtns .pastbtn{display:none}.resbtns .btn{font-size:14px!important;padding:0 8px}.result .rowhero svg{display:none}.result h1{font-size:22px}.result .newcat .art{width:46px;height:46px}.result .newcat .art svg{width:44px;height:44px}
  .stage-end .newsbox{display:none}.stage-end .hero>div:first-child{display:none!important}.result .hero svg[width="90"]{width:64px;height:64px}.result .hero>div[style*="width:100px"]{width:72px!important;height:64px!important}}
.hdate{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
main.home .streak{padding:6px 10px}main.home .streak b{font-size:20px}main.home .streak small{font-size:10px}
html.dark .btn.primary{background:#7B4FFF;color:#fff;border-color:#7B4FFF}
html.dark .btn.primary span[style*="var(--fish)"]{color:#FFF3B8!important}
@media (max-height:720px){
  main.home{gap:10px;padding-block:12px 14px}
  main.home .top{min-height:40px}
  .homecard{padding:14px 16px;gap:10px}
  .homecard .btn{min-height:46px!important}
  .daily{padding:14px 16px;gap:10px}
  .daily .btn{min-height:44px!important}
  .weekly{padding:12px 14px}
}
@media (max-height:620px){.tiles3 .tile-btn{min-height:50px;flex-direction:row;gap:6px;font-size:13px;padding:8px 6px}}
.shield{font-size:13px;font-weight:600;line-height:1.4}
.week i.fz{background:var(--cat-bg);font-size:13px;font-style:normal}
.lives{display:inline-flex;gap:2px;align-items:center}
.penalty{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-size:13px;font-weight:800;color:var(--bad);white-space:nowrap;animation:rise 1.1s ease-out forwards;pointer-events:none}
@keyframes rise{0%{opacity:0;translate:0 6px}20%{opacity:1}100%{opacity:0;translate:0 -22px}}
.cell.bad{background:var(--bad-bg)!important;box-shadow:inset 0 0 0 3px var(--bad)}
.linkbtn{background:none;border:0;padding:6px 0;font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.list button.justdone{animation:pop .5s ease-out both;box-shadow:inset 0 0 0 2px var(--good)}
.board.shakeb{animation:shake .4s}
.tile-btn .dot{position:absolute;top:8px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.installcard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 10px 10px 12px}
.installcard img{border-radius:11px;flex:none}
.steps{margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.45;color:var(--soft)}
.rank{background:var(--cat-bg);color:var(--ink);border-radius:16px;padding:12px 16px;font-size:15px;font-weight:700;text-align:center;line-height:1.4}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat b{font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat.dark{background:var(--night);color:var(--on-night);border-color:var(--night)}
.stat.dark .eyebrow{color:#AAAAAA}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.week i{width:36px;height:36px;border-radius:10px;background:var(--tile);display:grid;place-items:center}
.week i.on{background:var(--ink)}
.week i.today{box-shadow:0 0 0 2px var(--fish)}
.stage-end{background:var(--fish);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));position:relative;overflow:hidden}
.confetti i{position:absolute;border-radius:2px}

/* Niveles */
.stage-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.stage-row.locked{background:var(--tile);border-color:transparent}
.badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.stage-open{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:20px;background:var(--card);border:2px solid var(--ink)}
.lv-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{aspect-ratio:1;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:0}
.lv b{font-size:16px}.lv small{font-size:10px;letter-spacing:1px;color:#B38F00}
.lv.cur{background:var(--night);color:var(--on-night);box-shadow:0 0 0 3px var(--fish);border-color:var(--ink)}
.lv.cur small{color:var(--fish);letter-spacing:0;font-weight:600}
.lv.locked{background:var(--tile);border-color:transparent;color:var(--muted)}

/* Hojas */
.scrim{position:fixed;inset:-100px 0;background:rgba(10,10,10,.55);z-index:20}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(440px,100%);background:var(--bg);border-radius:28px 28px 0 0;z-index:21;
  padding:14px max(20px,env(safe-area-inset-left,0px)) calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;max-height:85vh;max-height:calc(100dvh - 12px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
html.lock,html.lock body{overflow:hidden;overscroll-behavior:none}
.grab{width:44px;height:5px;border-radius:999px;background:#D6D3C4;align-self:center;flex:none}
.sheet .hero h2{font-size:26px;letter-spacing:-.03em;line-height:1.1}
.sheet .hero p{font-size:15px;line-height:1.5;color:var(--muted);max-width:320px}
.mini{display:grid;grid-template-columns:repeat(3,64px);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;align-self:center}
.mini span{height:64px;border-radius:10px;background:var(--tile);position:relative;display:grid;place-items:center}
.mini .s{background:var(--ray)}
.mini .c{background:var(--cat-bg)}
.mini .l{background:var(--bad-bg);box-shadow:inset 0 0 0 3px var(--bad)}
.mini .c svg.f,.mini .l svg.f{position:absolute;left:6px;top:6px;width:28px}
.mini .c b,.mini .l b{position:absolute;right:6px;bottom:4px;font-size:18px}
.mini .l b{color:var(--bad)}
.mini .c .cr{position:absolute;right:5px;top:5px;width:22px}
.tagged{position:relative;animation:glow 1.2s ease-in-out infinite;z-index:3}
@keyframes glow{50%{box-shadow:0 0 0 4px var(--fish)}}
.tagbub{position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);background:var(--night);color:var(--fish);font-size:13px;font-weight:700;line-height:1.2;padding:7px 10px;border-radius:10px;white-space:nowrap;z-index:6;pointer-events:none;animation:pop .25s ease-out both}
.tagbub::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--ink)}
.tagbub.b{bottom:auto;top:calc(100% + 9px)}.tagbub.b::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--ink)}
.tagbub.l{left:0;transform:none}.tagbub.l::after{left:22px}
.tagbub.r{left:auto;right:0;transform:none}.tagbub.r::after{left:auto;right:16px}
@keyframes pop{from{opacity:0;translate:0 4px}to{opacity:1;translate:0 0}}
.tut{display:grid;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;align-self:center}
.tut button{width:64px;height:64px;border-radius:10px;border:0;background:var(--tile);position:relative;display:grid;place-items:center;padding:0;cursor:pointer}
.tut button.c{background:var(--cat-bg)}
.tut button.c svg.f{position:absolute;left:6px;top:6px;width:28px}
.tut button.c b{position:absolute;right:6px;bottom:4px;font-size:18px}
.tut button.acc{background:var(--bad-bg);box-shadow:inset 0 0 0 3px var(--bad)}
.tut button.acc b{color:var(--bad)}
.tut button.acc svg.f{color:var(--bad)!important}
.tut button.ok{box-shadow:inset 0 0 0 3px var(--good)}
.tut button.shake{animation:shake .4s}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:6px;height:6px;border-radius:999px;background:#D6D3C4}
.dots i.on{width:20px;background:var(--ink)}
.sharecard{border-radius:22px;padding:14px 18px;display:flex;flex-direction:column;align-items:center;gap:7px;flex:none;text-align:center;align-self:center;width:min(290px,100%)}
.sharetext{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.45;color:var(--soft);white-space:pre-line;user-select:text}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:50;transition:opacity .35s}
.splash.out{opacity:0;pointer-events:none}
/* festejo al ganar */
.board-wrap{position:relative}
.gameview{gap:16px;padding-top:max(28px,calc(env(safe-area-inset-top,0px) + 20px))}
.gameview>.top{margin-bottom:6px}
.gameview{--over:310px}.gameview.special{--over:360px}
.gameview .board-wrap{width:100%;align-self:center;max-width:max(220px,calc(100vh - var(--over)));max-width:max(220px,calc(100dvh - var(--over)))}
@media (max-height:720px){.gameview{gap:10px;padding-top:12px;padding-bottom:14px;--over:240px}.gameview.special{--over:322px}.gameview>.top{margin-bottom:0}.dailybar{padding:8px 14px}.dailybar b{font-size:24px}}
.supplyrow{display:flex;align-items:center;gap:10px;min-height:28px;padding:0 2px}
.supplyrow .fishrow{justify-content:flex-start;flex-wrap:nowrap}.supplyrow .fishrow.many{gap:3px}.supplyrow .fishrow.many svg{width:25px;height:15px}
.supplyrow .lives{margin-left:auto}
.cell.cheer{animation:cheer .55s ease-out both;animation-delay:var(--d,0ms)}
.cell.cat.cheer{background:#D9F2EA}.cell.cat.cheer .clue{color:var(--good)}.cell.cat.cheer .face{animation:blink .55s var(--d,0ms) both}
@keyframes cheer{0%{transform:none}35%{transform:translateY(-9px) scale(1.07)}70%{transform:translateY(1px) scale(.98)}100%{transform:none}}
@keyframes blink{40%{transform:scaleY(.15)}}
.cell.busted{animation:busted .7s cubic-bezier(.3,1.7,.5,1) both;z-index:4}
.cell.busted::before{animation:stamp .5s .15s cubic-bezier(.3,1.8,.5,1) both}
@keyframes busted{0%{transform:none}30%{transform:scale(1.2) rotate(-8deg)}55%{transform:scale(1.12) rotate(6deg)}100%{transform:none}}
@keyframes stamp{0%{transform:translateX(-50%) scale(2.4);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
.cell .fish.wig{animation:wig .45s ease-in-out 2;animation-delay:var(--d,0ms)}
@keyframes wig{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.burst{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:8}
.burst i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:3px;animation:fly 1s cubic-bezier(.2,.7,.4,1) forwards;animation-delay:var(--w,0ms)}
@keyframes fly{0%{transform:none;opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.cell.cat.pop .clue{animation:pop2 .35s ease-out}
@keyframes pop2{50%{transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){.cell,.cell.hint,.cell.shake,.cell.cheer,.cell.busted,.cell .fish,.cell::before,.cell .face,.cell .clue{animation:none!important;transition:none!important}
.burst{display:none}.splash{animation:none;transition:none}}
</style>

const stageStars=si=>{let t=0;for(let n=STAGES[si].from;n<=STAGES[si].to;n++)t+=save.stars[n]||0;return t};
const stageWon=si=>{let t=0;for(let n=STAGES[si].from;n<=STAGES[si].to;n++)if(save.won[n])t++;return t};
const current=()=>{if(TEST){for(let n=TEST_FROM;n<=TOTAL;n++)if(!save.won[n])return n;return TOTAL}return Math.min(save.unlocked,TOTAL)};
const allDone=()=>!!save.won[TOTAL];
const ico=(id,w,h,extra)=>`<svg width="${w}" height="${h||w}" aria-hidden="true" ${extra||""}><use href="#${id}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
const today=()=>dateKey(new Date());
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return dateKey(d)};
function dayIndex(){const d=new Date();return Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2026,9,29))/864e5)}
function dailyPuzzle(){const i=dayIndex();return DAILY[((i%DAILY.length)+DAILY.length)%DAILY.length]}
function longDate(){try{const s=new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});return s.charAt(0).toUpperCase()+s.slice(1)}catch(e){return today()}}
const shortDate=()=>{const d=new Date();return `${d.getDate()}/${d.getMonth()+1}`};
const daysAgo=k=>{const d=new Date();d.setDate(d.getDate()-k);return dateKey(d)};
const keyDays=k=>{const [y,m,d]=k.split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const FREEZE_DAYS=7;
function freezeLeft(){const f=save.daily.freeze;if(!f)return 0;return Math.max(0,FREEZE_DAYS-(keyDays(today())-keyDays(f)))}
const freezeReady=()=>freezeLeft()===0;
function streakNow(){const l=save.daily.last;if(l===today()||l===yesterday())return save.daily.streak;if(l===daysAgo(2)&&freezeReady())return save.daily.streak;return 0}
const shieldText=()=>freezeReady()?"🛡️ Protector de racha listo":`🛡️ El protector vuelve en ${plural(freezeLeft(),"día","días")}`;
/* caso de la semana: uno nuevo cada domingo */
function weekIndex(){const d=new Date();return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2026,9,25))/(7*864e5))}
function weeklyPuzzle(){const i=weekIndex();return WEEKLY[((i%WEEKLY.length)+WEEKLY.length)%WEEKLY.length]}
const weekKey=()=>"s"+weekIndex();
const weeklyCount=()=>Object.keys(save.weekly.results).length;
function daysToSunday(){const d=new Date().getDay();return d===0?7:7-d}
function untilMidnight(){const d=new Date(),m=new Date(d);m.setHours(24,0,0,0);const s=Math.max(0,Math.floor((m-d)/1000));return `${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`}
function weekHTML(){
  const d=new Date(),dow=(d.getDay()+6)%7,mon=new Date(d);mon.setDate(d.getDate()-dow);
  const names=["L","M","M","J","V","S","D"];let h='<div class="week" role="img" aria-label="Días jugados esta semana">';
  for(let i=0;i<7;i++){const x=new Date(mon);x.setDate(mon.getDate()+i);const k=dateKey(x),on=!!save.daily.results[k],fz=save.daily.freeze===k&&!on;
    h+=`<div>${names[i]}<i class="${on?"on":""} ${fz?"fz":""} ${i===dow?"today":""}">${on?ico("check",14,14,'style="color:var(--fish)"'):fz?"🛡️":""}</i></div>`}
  return h+"</div>";
}

/* ---------- sonido y vibración ---------- */
let actx=null;
function beep(freqs,dur){
  if(!save.settings.sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type="triangle";o.frequency.value=f;
      const t=actx.currentTime+i*dur;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+.02)})}catch(e){}
}
function buzz(ms){if(!save.settings.vib)return;try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ---------- Juego ---------- */
function makeGame(L,mode,num){
  const N=L.n*L.n;
  const cats=L.cats.map(([x,y,d,v,cr])=>{const r=[];let a=x+DIRS[d][0],b=y+DIRS[d][1];while(a>=0&&b>=0&&a<L.n&&b<L.n){r.push(b*L.n+a);a+=DIRS[d][0];b+=DIRS[d][1]}return{x,y,d,v,crown:!!cr,i:y*L.n+x,r}});
  const catAt=new Array(N).fill(-1);cats.forEach((c,ci)=>catAt[c.i]=ci);
  return{L,mode,num,n:L.n,N,cats,catAt,cells:new Array(N).fill(0),locked:new Set(),accused:[],sec:0,done:false,paused:false,
    hover:-1,crossMode:false,bulb:!!save.settings.bulb,focus:0,hintsUsed:0,errors:0};
}
const guideFixed=()=>G.mode==="level"&&G.num<=FIXED_TO;
const guideNums=()=>G.mode==="level"&&G.num<=GUIDE_TO;
const hoverAllowed=()=>(G.mode==="level"&&G.num<=HOVER_TO)||G.bulb;
const hasBulb=()=>G.mode!=="level"||G.num>=BULB_FROM;
const hasCross=()=>G.mode!=="level"||G.num>=CROSS_FROM;

function startLevel(num){
  num=Math.max(1,Math.min(+num||current(),TOTAL));
  if(num>save.unlocked){go("levels");return}
  G=makeGame(LEVELS[num-1],"level",num);
  view="game";
  if(!save.won[num])track("empieza",num);
  renderGameShell();
  const key=INTRO_AT[num];
  if(key&&!save.seen[key])showIntro(key,true);
  else if(num>=CROSS_FROM&&!save.seen.cross)showIntro("cross",true);
}
/* desafíos de días anteriores: se juegan sin ranking ni racha */
function dayDate(i){return new Date(2026,9,29+i)}
function dayLabel(i){try{const s=dayDate(i).toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});return s.charAt(0).toUpperCase()+s.slice(1)}catch(e){return "n.º "+(i+1)}}
const PAST_MAX=30;
function pastDays(){const t=dayIndex(),out=[];for(let i=t-1;i>=0&&out.length<PAST_MAX;i--)out.push(i);return out}
function startPast(i){
  i=+i;if(!(i>=0&&i<dayIndex())){go("past");return}
  G=makeGame(DAILY[((i%DAILY.length)+DAILY.length)%DAILY.length],"past",i);
  view="game";track("anterior-empieza");renderGameShell();
}
function renderPast(){
  save.daily.past=save.daily.past||{};const list=pastDays();
  app.innerHTML=`<main class="view" style="gap:14px"><div class="top"><button class="round" data-act="go" data-arg="home" aria-label="Volver al inicio">${ico("back",18)}</button><h1 class="grow">Días anteriores</h1></div>
    <p class="muted" style="font-size:14px;line-height:1.45">Los desafíos que te perdiste. Se juegan sin ranking y no suman a la racha.</p>
    ${list.length?`<div class="list">${list.map(i=>{const pr=save.daily.past[i],dr=save.daily.results[dateKey(dayDate(i))],done=pr||dr;
      return `<button data-act="playPast" data-arg="${i}"><span class="grow stack" style="gap:1px;text-align:left"><b style="font-size:15px">Desafío n.º ${i+1}</b><span class="muted" style="font-size:13px;font-weight:500">${dayLabel(i)}</span></span>${done?`<span class="pill" style="color:var(--good)">${ico("check",14)} ${fmt((pr||dr).t)}</span>`:`<span class="pill">Jugar</span>`}</button>`}).join("")}</div>`
    :`<div class="card center muted" style="font-size:15px;line-height:1.45">Todavía no hay días anteriores. Mañana vas a poder jugar el de hoy desde acá.</div>`}
  </main>`;
}
function startWeekly(){
  if(save.unlocked<WEEKLY_FROM){go("home");return}
  if(save.weekly.results[weekKey()]){view="weeklyResult";renderWeeklyResult({});return}
  G=makeGame(weeklyPuzzle(),"weekly",0);
  view="game";
  track("semana-empieza");

  if(o.cta){c.font=`700 52px ${F}`;const tw=c.measureText(o.cta).width+90,bx=W/2-tw/2,by=Math.min(y0+h0-140,yy+70);c.fillStyle="#F5C800";c.beginPath();c.roundRect?c.roundRect(bx,by,tw,96,48):c.rect(bx,by,tw,96);c.fill();c.fillStyle="#0A0A0A";c.fillText(o.cta,W/2,by+66)}

async function shareImage(btn){

function copyShare(btn){
  const done=()=>{btn.textContent="¡Copiado!";setTimeout(()=>{if(btn.isConnected)btn.textContent="Copiar texto"},1800)};
  const fallback=()=>{const el=$("shareText");if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent="Seleccionado"};
  try{navigator.clipboard.writeText(window.__share).then(done,fallback)}catch(e){fallback()}
}

/* ---------- acciones ---------- */
const ACT={
  noop(){},
  go(a){go(a)},
  back(){go(backTo||"home")},
  how(){backTo="settings";go("how")},
  play(a){go("game",+a)},
  closeSheet(){closeSheet()},
  exitGame(){exitGame()},
  resetBoard(){if(!G||G.done)return;G.cells=G.cells.map((v,i)=>G.locked.has(i)?1:0);G.accused=[];G.crossMode=false;setStatus("Tablero limpio. El reloj sigue corriendo.");renderBoard()},
  hint(){hint()},
  toggleCross(){if(!G)return;G.crossMode=!G.crossMode;setStatus(G.crossMode?"Modo cruz: tocá las casillas donde no va un pez.":"");renderBoard()},
  toggleBulb(){if(!G)return;G.bulb=!G.bulb;G.hover=-1;renderBoard()},
  introOk(k,btn){if(btn&&btn.disabled)return;save.seen[k]=1;persist();tut=null;closeSheet();if(G){G.paused=false;setTimeout(()=>showTag(k),150)}},
  tutTap(a){tutTap(+a)},
  toggleStage(a){openStage=openStage===+a?-1:+a;renderLevels()},
  lockedLevel(a){const n=current(),k=+a;lockedSheet(`El nivel ${k} todavía está cerrado`,`Los niveles se abren de a uno. Te ${k-n===1?"falta 1":"faltan "+(k-n)} para llegar: seguí por el nivel ${n}.`)},
  lockedStage(a){const st=STAGES[+a],n=current();lockedSheet(`${st.name} todavía está cerrada`,`Se abre en el nivel ${st.from}. Te ${st.from-n===1?"falta 1 nivel":"faltan "+(st.from-n)+" niveles"}: seguí por el nivel ${n}.`)},
  stageEnd(a){go("stage",a)},
  shareLevel(){shareLevel()},shareWeekly(){shareWeekly()},shareStage(a){shareStage(a)},shareDaily(){shareDaily()},
  copyShare(a,btn){copyShare(btn)},
  helpCard(a){helpCard(+a)},
  reseen(){save.seen={};persist();const b=document.querySelector('[data-act="reseen"]');if(b)b.textContent="Listo: vuelven a aparecer"},
  askReset(){askReset()},
  doReset(){const s=save.settings;save=blank();save.settings=s;save.welcomed=0;persist();openStage=null;go("welcome")},
  installApp(){installApp()},
  shareImg(a,btn){shareImage(btn)},
  playPast(a){startPast(a)},
  restartLives(){restartLives()},
  pushOn(a,btn){btn.textContent="…";enablePush().then(ok=>{const c=$("pushAsk");if(c)c.innerHTML=ok?`<span style="font-weight:700;padding:4px 6px">Listo: te avisamos mañana si no jugaste.</span>`:`<span style="padding:4px 6px">No se pudo activar. Probá desde Ajustes.</span>`})},
  pushNo(){save.pushAsked=1;persist();const c=$("pushAsk");if(c)c.remove()},
  pushToggle(){if(pushNeedsInstall()){installApp();return}const st=$("pushState");if(save.push){disablePush().then(()=>{if(view==="settings")renderSettings()})}else{if(st)st.textContent="…";enablePush().then(()=>{if(view==="settings")renderSettings()})}},
  setLang(){save.lang=LANG==="es"?"en":"es";persist();if(GAME_URL)location.href=OTHER_URL;else{const b=document.querySelector('[data-act="setLang"]');if(b)b.lastChild.textContent=LANG==="es"?"Disponible en la web":"Available on the web"}},
  hideInstall(){save.installHint=1;persist();renderHome()},
  welcomeGo(){save.welcomed=1;persist();track("bienvenida");go("game",1)},
  copyLog(a,btn){const t=testText();try{navigator.clipboard.writeText(t).then(()=>{btn.textContent="¡Copiado!"},()=>{btn.textContent="No se pudo copiar"})}catch(e){btn.textContent="No se pudo copiar"}},
  clearLog(){save.log=[];save.won={};save.stars={};persist();go("home")}
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t)return;const f=ACT[t.dataset.act];if(f){e.preventDefault();f(t.dataset.arg,t,e)}});
function applyTheme(){const d=!!save.settings.dark;document.documentElement.classList.toggle("dark",d);const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",d?"#151513":"#F8F7EC")}
applyTheme();
document.addEventListener("change",e=>{const t=e.target;if(t.dataset&&t.dataset.set){save.settings[t.dataset.set]=t.checked?1:0;persist();if(t.dataset.set==="dark"){applyTheme();track(t.checked?"oscuro-on":"oscuro-off")}if(t.dataset.set==="relax")track(t.checked?"sinreloj-on":"sinreloj-off");if(t.dataset.set==="sound"&&t.checked)beep([523],.06);if(t.dataset.set==="vib"&&t.checked)buzz(20)}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("sheetRoot").innerHTML){const s=$("sheetRoot").querySelector('.scrim[data-act="closeSheet"]');if(s)closeSheet();return}
  if(view!=="game"||!G||$("sheetRoot").innerHTML)return;
  if(!e.target.closest||!e.target.closest(".board"))return;
  const n=G.n;let f=G.focus;
  if(e.key==="ArrowRight")f=f%n<n-1?f+1:f;else if(e.key==="ArrowLeft")f=f%n>0?f-1:f;
  else if(e.key==="ArrowDown")f=f+n<G.N?f+n:f;else if(e.key==="ArrowUp")f=f-n>=0?f-n:f;
  else if(e.key===" "||e.key==="Enter"){e.preventDefault();G.catAt[f]>=0?tapCat(G.catAt[f]):tapCell(f,1);$("c"+f).focus();return}
  else if((e.key==="x"||e.key==="X")&&hasCross()&&G.catAt[f]<0){tapCell(f,2);$("c"+f).focus();return}
  else return;
  e.preventDefault();G.focus=f;renderBoard();$("c"+f).focus();
});

/* ---------- arranque ---------- */
function boot(){
  if(GAME_URL&&!TEST){
    if(!save.lang){save.lang=/^es\b/i.test(navigator.language||"es")?"es":"en";persist()}
    if(save.lang!==LANG){location.replace(OTHER_URL+location.hash);return}
  }
  if(STANDALONE)track("abre-app");
  if(!save.welcomed)go("welcome");else go("home");
  const sp=$("splash");setTimeout(()=>{sp.classList.add("out");setTimeout(()=>sp.remove(),400)},900);
}
boot();
})();
