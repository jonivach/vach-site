<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna tipo app de celular, centrada; paleta VACH* sobre crema (un solo tema, elegido) */
:root{
  --bg:#F8F7EC; --card:#FFFEF8; --tile:#EEECDD; --ink:#0A0A0A; --muted:#66655C; --soft:#3D3C36; --line:rgba(10,10,10,.12);
  --fish:#F5C800; --cat:#7B4FFF; --cat-bg:#EAE3FF; --ray:#E4DEF5; --good:#0E9A7C; --bad:#D9432C; --bad-bg:#FBE1DB;
  --f:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
a{color:inherit}
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.view{display:flex;flex-direction:column;gap:16px;padding-block:20px 28px;flex:1}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:12px;min-height:44px}
.top h1{font-size:26px;letter-spacing:-.03em}
.round{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none;cursor:pointer;padding:0}
.round svg{width:18px;height:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:999px;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:0 20px;width:100%}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:999px;padding:5px 10px;background:var(--card);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.liar{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.full{color:var(--good);border-color:var(--good)}
.pill.yellow{background:var(--fish);border:1.5px solid var(--ink)}
:focus-visible{outline:3px solid var(--cat);outline-offset:2px}
.muted{color:var(--muted)}
.center{text-align:center}
.stack{display:flex;flex-direction:column;gap:10px}
.mt-auto{margin-top:auto}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.list>*{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;min-height:58px;border:0;border-bottom:1px solid rgba(10,10,10,.08);background:none;text-align:left;width:100%;cursor:pointer;font-size:16px;font-weight:600;text-decoration:none}
.list>*:last-child{border-bottom:0}
.sw{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:999px;background:#D6D3C4;position:relative;margin:0;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--card);transition:left .15s}
.sw:checked{background:var(--good)}.sw:checked::after{left:23px}

/* Inicio */
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:-.03em}
.minib{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:200px;align-self:center}
.minib span{aspect-ratio:1;border-radius:8px;background:var(--tile);display:grid;place-items:center}
.minib span.c{background:var(--cat-bg)}
.bar{height:8px;border-radius:999px;background:var(--tile);overflow:hidden}
.bar i{display:block;height:100%;background:var(--cat);border-radius:999px}
.daily{background:var(--fish);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.streak{display:flex;flex-direction:column;align-items:center;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 12px;flex:none}
.streak b{font-size:22px;line-height:1}.streak small{font-size:11px;font-weight:600}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;min-height:80px;padding:12px 6px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none}
.tile-btn svg{width:22px;height:22px}
.tile-btn.off{background:var(--tile);border-color:transparent;color:#8A887C;cursor:default}
.tile-btn small{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Juego */
.supply{display:flex;flex-direction:column;align-items:center;gap:4px}
.supply .row{justify-content:center;flex-wrap:wrap;gap:8px}
.supply strong{font-size:18px}
.fishrow{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.fishrow svg{width:40px;height:24px;transition:filter .2s,opacity .2s,transform .2s}
.fishrow svg.used{filter:grayscale(1);opacity:.3;transform:scale(.88)}
.reward{font-size:13px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.reward b{color:var(--ink)}
.board-wrap{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px}
.board{display:grid;gap:5px;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cell{position:relative;aspect-ratio:1;border:0;border-radius:9px;background:var(--tile);padding:0;cursor:pointer;display:grid;place-items:center;transition:background .12s,transform .08s}
.cell:active{transform:scale(.95)}
.cell.seen,.cell.ray{background:var(--ray)}
.cell .fish{width:72%}
.cell .x{width:34%}
.cell.lock{box-shadow:inset 0 0 0 2px var(--good)}
.cell.cat{background:var(--cat-bg)}
.cell.cat .face{position:absolute;left:9%;top:8%;width:46%}
.cell.cat .clue{position:absolute;right:8%;bottom:5%;display:flex;align-items:center;gap:1px;font-weight:700;line-height:1;font-size:var(--clue,18px)}
.cell.cat .clue svg{width:calc(var(--clue,18px)*.8);height:calc(var(--clue,18px)*.8)}
.cell.cat .crown{position:absolute;right:7%;top:6%;width:34%}
.cell.cat.ok .clue{color:var(--good)}
.cell.cat.over .clue{color:var(--bad)}
.cell.cat.hov{box-shadow:inset 0 0 0 3px var(--cat)}
.cell.cat.acc{background:var(--bad-bg);box-shadow:inset 0 0 0 3px var(--bad)}
.cell.cat.acc .face path{fill:var(--bad)}
.cell.cat.acc .clue{color:var(--bad)}
.cell.cat.acc::before{content:"¡Miente!";position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;background:var(--bad);color:var(--card);border-radius:999px;padding:2px 6px;white-space:nowrap;z-index:2}
.cell.hint{animation:pulse 1.1s ease-in-out 3}
.cell.shake{animation:shake .4s}
@keyframes pulse{50%{box-shadow:inset 0 0 0 4px var(--good)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.status{min-height:22px;text-align:center;font-size:15px;font-weight:600;color:var(--muted)}
.status.ok{color:var(--good)}.status.warn{color:var(--bad)}.status.info{color:var(--cat)}
.controls{display:flex;gap:8px}
.controls .ctl{flex:1 1 0;min-width:0;min-height:50px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:700;cursor:pointer}
.controls .tool{flex:0 0 52px;display:grid;place-items:center;padding:0}
.controls .tool svg{width:22px;height:22px}
.controls .tool[aria-pressed="true"]{background:var(--fish);border-color:var(--ink)}
.dailybar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 16px}
.dailybar b{font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* Victoria y resultados */
.hero{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:8px}
.hero h1{font-size:38px;letter-spacing:-.04em;line-height:1}
.stars{display:flex;gap:10px}
.stars svg{width:46px;height:46px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat b{font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stat.dark .eyebrow{color:#AAAAAA}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.week i{width:36px;height:36px;border-radius:10px;background:var(--tile);display:grid;place-items:center}
.week i.on{background:var(--ink)}
.week i.today{box-shadow:0 0 0 2px var(--fish)}
.stage-end{background:var(--fish);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));position:relative;overflow:hidden}
.confetti i{position:absolute;border-radius:2px}

/* Niveles */
.stage-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.stage-row.locked{background:var(--tile);border-color:transparent}
.badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.stage-open{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:20px;background:var(--card);border:2px solid var(--ink)}
.lv-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{aspect-ratio:1;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:0}
.lv b{font-size:16px}.lv small{font-size:10px;letter-spacing:1px;color:#B38F00}
.lv.cur{background:var(--ink);color:var(--bg);box-shadow:0 0 0 3px var(--fish);border-color:var(--ink)}
.lv.cur small{color:var(--fish);letter-spacing:0;font-weight:600}
.lv.locked{background:var(--tile);border-color:transparent;color:var(--muted)}

/* Hojas */
.scrim{position:fixed;inset:-100px 0;background:rgba(10,10,10,.55);z-index:20}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(440px,100%);background:var(--bg);border-radius:28px 28px 0 0;z-index:21;
  padding:14px max(20px,env(safe-area-inset-left,0px)) calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;max-height:85vh;max-height:calc(100dvh - 12px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
html.lock,html.lock body{overflow:hidden;overscroll-behavior:none}
.grab{width:44px;height:5px;border-radius:999px;background:#D6D3C4;align-self:center;flex:none}
.sheet .hero h2{font-size:26px;letter-spacing:-.03em;line-height:1.1}
.sheet .hero p{font-size:15px;line-height:1.5;color:var(--muted);max-width:320px}
.mini{display:grid;grid-template-columns:repeat(3,64px);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;align-self:center}
.mini span{height:64px;border-radius:10px;background:var(--tile);position:relative;display:grid;place-items:center}
.mini .s{background:var(--ray)}
.mini .c{background:var(--cat-bg)}
.mini .l{background:var(--bad-bg);box-shadow:inset 0 0 0 3px var(--bad)}
.mini .c svg.f,.mini .l svg.f{position:absolute;left:6px;top:6px;width:28px}
.mini .c b,.mini .l b{position:absolute;right:6px;bottom:4px;font-size:18px}
.mini .l b{color:var(--bad)}
.mini .c .cr{position:absolute;right:5px;top:5px;width:22px}
.tagged{position:relative;animation:glow 1.2s ease-in-out infinite;z-index:3}
@keyframes glow{50%{box-shadow:0 0 0 4px var(--fish)}}
.tagbub{position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--fish);font-size:13px;font-weight:700;line-height:1.2;padding:7px 10px;border-radius:10px;white-space:nowrap;z-index:6;pointer-events:none;animation:pop .25s ease-out both}
.tagbub::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--ink)}
.tagbub.l{left:0;transform:none}.tagbub.l::after{left:22px}
.tagbub.r{left:auto;right:0;transform:none}.tagbub.r::after{left:auto;right:16px}
@keyframes pop{from{opacity:0;translate:0 4px}to{opacity:1;translate:0 0}}
.tut{display:grid;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;align-self:center}
.tut button{width:64px;height:64px;border-radius:10px;border:0;background:var(--tile);position:relative;display:grid;place-items:center;padding:0;cursor:pointer}
.tut button.c{background:var(--cat-bg)}
.tut button.c svg.f{position:absolute;left:6px;top:6px;width:28px}
.tut button.c b{position:absolute;right:6px;bottom:4px;font-size:18px}
.tut button.acc{background:var(--bad-bg);box-shadow:inset 0 0 0 3px var(--bad)}
.tut button.acc b{color:var(--bad)}
.tut button.acc svg.f{color:var(--bad)!important}
.tut button.ok{box-shadow:inset 0 0 0 3px var(--good)}
.tut button.shake{animation:shake .4s}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:6px;height:6px;border-radius:999px;background:#D6D3C4}
.dots i.on{width:20px;background:var(--ink)}
.sharecard{border-radius:22px;padding:14px 18px;display:flex;flex-direction:column;align-items:center;gap:7px;flex:none;text-align:center;align-self:center;width:min(290px,100%)}
.sharetext{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.45;color:var(--soft);white-space:pre-line;user-select:text}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:50;transition:opacity .35s}
.splash.out{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.cell,.cell.hint,.cell.shake,.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.splash{animation:none;transition:none}}
</style>

</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="cat" viewBox="0 0 40 40"><path fill="currentColor" d="M7 8l8 6.5a15 15 0 0 1 10 0L33 8l1 13a14 13 0 1 1-28 0z"/><circle cx="15" cy="23" r="2.2" fill="var(--eye,#F8F7EC)"/><circle cx="25" cy="23" r="2.2" fill="var(--eye,#F8F7EC)"/></symbol>

  <symbol id="cat-sad" viewBox="0 0 40 40"><path fill="currentColor" d="M7 8l8 6.5a15 15 0 0 1 10 0L33 8l1 13a14 13 0 1 1-28 0z"/><circle cx="15" cy="23" r="2.2" fill="var(--eye,#F8F7EC)"/><circle cx="25" cy="23" r="2.2" fill="var(--eye,#F8F7EC)"/><path d="M17 30q3 -2.5 6 0" fill="none" stroke="var(--eye,#F8F7EC)" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="fish" viewBox="0 0 40 24"><path fill="#F5C800" stroke="#0A0A0A" stroke-width="1.6" stroke-linejoin="round" d="M4 12C9 3 20 1 28 8l8-6v20l-8-6C20 23 9 21 4 12z"/><circle cx="11" cy="10.5" r="1.9" fill="#0A0A0A"/></symbol>
  <symbol id="x" viewBox="0 0 20 20"><path d="M4 4l12 12M16 4L4 16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
  <symbol id="arrow" viewBox="0 0 20 20"><path d="M3 10h12M10 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="back" viewBox="0 0 20 20"><path d="M17 10H5M10 5l-5 5 5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="close" viewBox="0 0 20 20"><path d="M4 4l12 12M16 4L4 16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="chev" viewBox="0 0 20 20"><path d="M8 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z" stroke="#0A0A0A" stroke-width="1.4" stroke-linejoin="round"/></symbol>

const stageWon=si=>{let t=0;for(let n=STAGES[si].from;n<=STAGES[si].to;n++)if(save.won[n])t++;return t};

function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
const today=()=>dateKey(new Date());
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return dateKey(d)};
function dayIndex(){const d=new Date();return Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2026,9,29))/864e5)}
function dailyPuzzle(){const i=dayIndex();return DAILY[((i%DAILY.length)+DAILY.length)%DAILY.length]}
function longDate(){try{const s=new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});return s.charAt(0).toUpperCase()+s.slice(1)}catch(e){return today()}}
const shortDate=()=>{const d=new Date();return `${d.getDate()}/${d.getMonth()+1}`};
function streakNow(){const l=save.daily.last;return (l===today()||l===yesterday())?save.daily.streak:0}
function untilMidnight(){const d=new Date(),m=new Date(d);m.setHours(24,0,0,0);const s=Math.max(0,Math.floor((m-d)/1000));return `${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`}
function weekHTML(){
  const d=new Date(),dow=(d.getDay()+6)%7,mon=new Date(d);mon.setDate(d.getDate()-dow);
  const names=["L","M","M","J","V","S","D"];let h='<div class="week" role="img" aria-label="Días jugados esta semana">';
  for(let i=0;i<7;i++){const x=new Date(mon);x.setDate(mon.getDate()+i);const k=dateKey(x),on=!!save.daily.results[k];
    h+=`<div>${names[i]}<i class="${on?"on":""} ${i===dow?"today":""}">${on?ico("check",14,14,'style="color:var(--fish)"'):""}</i></div>`}

/* ---------- sonido y vibración ---------- */
let actx=null;
function beep(freqs,dur){
  if(!save.settings.sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type="triangle";o.frequency.value=f;
      const t=actx.currentTime+i*dur;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+.02)})}catch(e){}
}
function buzz(ms){if(!save.settings.vib)return;try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ---------- Juego ---------- */
function makeGame(L,mode,num){
  const N=L.n*L.n;
  const cats=L.cats.map(([x,y,d,v,cr])=>{const r=[];let a=x+DIRS[d][0],b=y+DIRS[d][1];while(a>=0&&b>=0&&a<L.n&&b<L.n){r.push(b*L.n+a);a+=DIRS[d][0];b+=DIRS[d][1]}return{x,y,d,v,crown:!!cr,i:y*L.n+x,r}});
  const catAt=new Array(N).fill(-1);cats.forEach((c,ci)=>catAt[c.i]=ci);
  return{L,mode,num,n:L.n,N,cats,catAt,cells:new Array(N).fill(0),locked:new Set(),accused:[],sec:0,done:false,paused:false,
    hover:-1,crossMode:false,bulb:!!save.settings.bulb,focus:0,hintsUsed:0};
}
const guideFixed=()=>G.mode==="level"&&G.num<=FIXED_TO;
const guideNums=()=>G.mode==="level"&&G.num<=GUIDE_TO;
const hoverAllowed=()=>(G.mode==="level"&&G.num<=GUIDE_TO)||G.bulb;
const hasBulb=()=>G.mode==="daily"||G.num>=BULB_FROM;
const hasCross=()=>G.mode==="daily"||G.num>=CROSS_FROM;

function startLevel(num){
  num=Math.max(1,Math.min(+num||current(),TOTAL));
  if(num>save.unlocked){go("levels");return}
  G=makeGame(LEVELS[num-1],"level",num);
  view="game";
  renderGameShell();
  const key=INTRO_AT[num];
  if(key&&!save.seen[key])showIntro(key,true);
  else if(num>=CROSS_FROM&&!save.seen.cross)showIntro("cross",true);
}
function startDaily(){
  const dk=save.daily.results[today()];
  if(dk){view="dailyResult";renderDailyResult({already:true});return}
  G=makeGame(dailyPuzzle(),"daily",0);
  view="game";
  renderGameShell();
}
function renderGameShell(){
  const L=G.L,daily=G.mode==="daily",si=daily?0:stageOf(G.num);
  const liarPill=L.L?`<span class="pill liar">${L.L===2?"2 mentirosos":"1 mentiroso"}</span>`:"";
  const head=daily?`
    <div class="top"><button class="round" data-act="exitGame" aria-label="Volver al inicio">${ico("back",18)}</button>
      <div class="grow stack" style="gap:1px"><span class="eyebrow">Desafío del día</span><span style="font-size:18px;font-weight:700;letter-spacing:-.02em">${longDate()}</span></div>
      <span class="pill yellow">Racha ${streakNow()}</span></div>
    <div class="dailybar"><div class="stack" style="gap:1px"><span class="eyebrow" style="color:#AAAAAA">Tu tiempo</span><b id="timer">0:00</b></div>
      <div class="stack" style="gap:1px;align-items:flex-end;text-align:right"><span style="font-size:12px;color:#AAAAAA">Desafío n.º ${dayIndex()+1}</span><span style="font-size:15px;font-weight:700;color:var(--fish)">Hoy todos juegan este tablero</span></div></div>`
  :`<div class="top"><button class="round" data-act="exitGame" aria-label="Salir del nivel">${ico("back",18)}</button>
      <div class="grow stack" style="gap:1px"><span class="eyebrow">${STAGES[si].name}</span><span style="font-size:20px;font-weight:700;letter-spacing:-.02em">Nivel ${G.num}</span></div>
      ${liarPill}<span class="pill" id="timer">0:00</span></div>`;
  app.innerHTML=`<main class="view" style="gap:14px">${head}
    <div class="supply"><div class="row"><div class="fishrow" id="fishrow" role="img"></div>${daily?liarPill:""}</div>${daily?"":'<span class="reward" id="reward"></span>'}</div>
    <div class="board-wrap"><div class="board" id="board" role="grid" aria-label="Tablero de ${L.n} por ${L.n}"></div></div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="controls">
      <button class="ctl" data-act="resetBoard">Reiniciar</button>
      <button class="ctl" data-act="hint" id="hintBtn">Pista</button>
      ${hasCross()?`<button class="ctl tool" data-act="toggleCross" id="crossBtn" aria-pressed="false" aria-label="Poner cruces donde no va un pez">${ico("x",18,18)}</button>`:""}
      ${hasBulb()?`<button class="ctl tool" data-act="toggleBulb" id="bulbBtn" aria-pressed="false" aria-label="Ver lo que mira un gato al pasar por encima">${ico("bulb",22)}</button>`:""}
    </div>
  </main>`;
  buildBoard();renderBoard();drawTime();
  clearInterval(tick);
  tick=setInterval(()=>{if(G&&view==="game"&&!G.done&&!G.paused&&!document.hidden){G.sec++;drawTime()}},1000);
}
function drawTime(){
  const t=$("timer");if(t)t.textContent=fmt(G.sec);
  const r=$("reward");if(!r)return;
  const [a,b]=LIMITS[G.n];
  const canGain=!save.won[G.num]&&G.num>=HINT_FROM&&save.bank<HINT_CAP;
  if(G.sec<=a)r.innerHTML=canGain?`Terminá antes de <b>${fmt(a)}</b>: 3 estrellas y <b>1 pista</b>`:`Terminá antes de <b>${fmt(a)}</b> para 3 estrellas`;
  else if(G.sec<=b)r.innerHTML=`Terminá antes de <b>${fmt(b)}</b> para 2 estrellas`;
  else r.textContent="Terminalo y te llevás 1 estrella";
}
const CLUE={3:24,4:21,5:18,6:15,7:13};
function buildBoard(){
  const b=$("board");b.style.gridTemplateColumns=`repeat(${G.n},1fr)`;b.style.setProperty("--clue",CLUE[G.n]+"px");
  b.innerHTML="";
  for(let i=0;i<G.N;i++){
    const ci=G.catAt[i];
    const el=document.createElement("button");el.className="cell";el.id="c"+i;el.tabIndex=i===0?0:-1;
    if(ci>=0){
      const c=G.cats[ci];el.classList.add("cat");

function hoverCat(ci,on){

}
function seenBy(ci){return G.cats[ci].r.filter(j=>G.cells[j]===1).length}
function renderBoard(){
  if(!G||!$("board"))return;

  const hov=G.hover>=0&&hoverAllowed()?new Set(G.cats[G.hover].r):new Set();
  for(let i=0;i<G.N;i++){
    const el=$("c"+i),ci=G.catAt[i];
    el.tabIndex=i===G.focus?0:-1;

      const c=G.cats[ci],sb=seenBy(ci),acc=G.accused.includes(ci);
      el.classList.toggle("acc",acc);

    const want=v===1?"f":v===2?"x":"";
    if(el.dataset.v!==want){el.dataset.v=want;el.innerHTML=v===1?'<svg class="fish" viewBox="0 0 40 24" aria-hidden="true"><use href="#fish"/></svg>':v===2?'<svg class="x" viewBox="0 0 20 20" aria-hidden="true" style="color:#8A887C"><use href="#x"/></svg>':""}

function setStatus(t,cls){const s=$("status");if(!s)return;s.textContent=t||"";s.className="status"+(cls?" "+cls:"")}
function flash(i,cls){const el=$("c"+i);if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),cls==="hint"?3400:450)}

function tapCell(i,force){
  if(!G||G.done)return;clearTag();

function tapCat(ci){
  if(!G||G.done)return;clearTag();

  else{
    if(G.accused.length>=G.L.L){setStatus(`Ya acusaste a ${G.L.L===1?"un gato":"dos gatos"}. Tocá un acusado para sacarle la acusación.`,"warn");return}

function wrongCats(){const w=[];G.cats.forEach((c,ci)=>{if(seenBy(ci)!==c.v)w.push(ci)});return w}
function check(fromCat){
  const L=G.L,placed=G.cells.filter(v=>v===1).length;
  if(placed<L.k){setStatus(fromCat&&G.accused.length?`Acusaste a ${G.accused.length===1?"un gato":"dos gatos"}.`:"");return}
  const w=wrongCats();
  if(!L.L){if(!w.length)return win();setStatus(w.length===1?"Hay un gato que no está de acuerdo. Revisá.":"Hay gatos que no están de acuerdo. Revisá.","warn");return}
  if(w.some(ci=>G.cats[ci].crown)){setStatus("Con estos peces, el gato con corona estaría mintiendo. Y nunca miente.","warn");return}
  if(w.length===0){setStatus("Con estos peces nadie miente, pero alguien tiene que mentir. Revisá.","warn");return}
  if(w.length<L.L){setStatus("Con estos peces miente un solo gato, pero son dos. Revisá.","warn");return}
  if(w.length>L.L){setStatus(`Con estos peces, más de ${L.L===1?"un gato estaría":"dos gatos estarían"} mintiendo. Revisá.`,"warn");return}
  if(G.accused.length<L.L){setStatus(L.L===1?"Los peces cierran. Ahora tocá al gato mentiroso.":G.accused.length?"Los peces cierran. Falta acusar a otro gato.":"Los peces cierran. Ahora tocá a los dos gatos mentirosos.","ok");return}
  const bad=G.accused.filter(ci=>!w.includes(ci));
  if(bad.length){bad.forEach(ci=>flash(G.cats[ci].i,"shake"));setStatus(L.L===1?"Ese gato dice la verdad. El mentiroso es otro.":"Un gato acusado dice la verdad. Revisá.","warn");buzz(40);return}
  win();
}
function hint(){
  if(!G||G.done)return;
  if(save.bank<=0){noHintsSheet();return}
  const sol=new Set(G.L.sol);let target=-1,msg="",cls="ok";
  for(let i=0;i<G.N;i++)if(G.cells[i]===1&&!sol.has(i)&&!G.locked.has(i)){target=i;msg="Este pez no va acá.";cls="warn";break}
  if(target<0)for(const i of G.L.sol)if(G.cells[i]!==1){
    if(G.cells.filter(v=>v===1).length>=G.L.k)break;
    G.cells[i]=1;G.locked.add(i);target=i;msg="Te dejé un pez en su lugar.";break}
  if(target<0){const li=G.L.li.find(x=>!G.accused.includes(x));if(li!==undefined){target=G.cats[li].i;msg="Mirá bien a este gato.";cls="info"}}
  if(target<0){const wrongAcc=G.accused.find(ci=>!G.L.li.includes(ci));if(wrongAcc!==undefined){target=G.cats[wrongAcc].i;msg="Este gato acusado dice la verdad.";cls="warn"}}
  if(target<0)return;
  save.bank--;G.hintsUsed++;persist();G.focus=target;
  renderBoard();flash(target,"hint");check();if(!G.done)setStatus(msg,cls);
}

function win(){

    const t=today(),first=!save.daily.results[t];lastDailyGain=0;
    if(first){
      save.daily.streak=save.daily.last===yesterday()?save.daily.streak+1:(save.daily.last===t?save.daily.streak:1);

    <div class="confetti" aria-hidden="true">${conf.map(([x,y,c,r,w,h])=>`<i style="left:${x/390*100}%;top:${y}px;width:${w}px;height:${h}px;background:${c};transform:rotate(${r}deg);${w===h?"border-radius:50%":""}"></i>`).join("")}</div>
    <div class="hero" style="position:relative;margin-top:20px"><div style="width:150px;height:150px;border-radius:50%;background:var(--ink);display:grid;place-items:center;box-shadow:0 0 0 8px var(--card)"><svg width="96" height="96" style="color:var(--cat);--eye:var(--ink)" aria-hidden="true"><use href="#cat-happy"/></svg></div>
      <span class="eyebrow" style="color:var(--ink)">Terminaste ${st.name}</span><h1>${next?`¡Ascendiste a ${next.name}!`:"¡Sos una Leyenda!"}</h1></div>
    <div class="stats" style="position:relative"><div class="stat" style="border:0"><span class="eyebrow">Niveles</span><b>${stageWon(si)} de ${count}</b></div><div class="stat" style="border:0"><span class="eyebrow">Estrellas</span><b>${stageStars(si)} de ${count*3}</b></div></div>
    ${lastStageGain?`<p class="center" style="position:relative;font-size:16px;font-weight:700">+${lastStageGain} ${lastStageGain===1?"pista":"pistas"} por terminar la etapa</p>`:""}
    ${next?`<div class="row" style="position:relative;background:var(--ink);color:var(--bg);border-radius:20px;padding:16px 18px;gap:14px"><span class="badge" style="width:44px;height:44px;background:var(--bg);color:var(--ink)">${ico("lock",20)}</span><span class="stack" style="gap:2px"><span class="eyebrow" style="color:var(--fish)">Novedad</span><span style="font-size:15px;line-height:1.4">En ${next.name}: ${next.news}, ${next.size}.</span></span></div>`:`<p class="center" style="position:relative;font-size:16px;line-height:1.5">Terminaste los 150 niveles de Gato Encerrado. Seguí jugando el desafío de cada día.</p>`}
    <div class="stack mt-auto" style="position:relative">${next?`<button class="btn primary" data-act="play" data-arg="${next.from}">Seguir a ${next.name} ${ico("arrow",18,18,'style="color:var(--fish)"')}</button>`:`<button class="btn primary" data-act="go" data-arg="home">Volver al inicio</button>`}

/* ---------- Desafío: resultado ---------- */

    <div class="hero">${o.fresh?`<svg width="72" height="72" style="color:var(--cat)" aria-hidden="true"><use href="#cat-happy"/></svg><h1>¡Desafío resuelto!</h1>`:`<svg width="72" height="72" style="color:var(--cat)" aria-hidden="true"><use href="#cat-happy"/></svg><h1 style="font-size:32px">Ya resolviste el desafío de hoy</h1>`}</div>

    <div class="row" style="justify-content:center;background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 16px;gap:10px"><span style="font-size:13px;color:#AAAAAA">Nuevo desafío en</span><b id="countdown" style="font-size:20px;color:var(--fish);font-variant-numeric:tabular-nums">${untilMidnight()}</b></div>

setInterval(()=>{const c=$("countdown");if(c)c.textContent=untilMidnight()},1000);

/* ---------- Compartir ---------- */
function shareSheet(cardHTML,text){
  const full=text+(GAME_URL?"\n"+GAME_URL:"");
  openSheet(`<h2 id="sheetTitle" class="visually-hidden">Compartir</h2>${cardHTML}<div class="sharetext" id="shareText">${esc(full)}</div>
    <div class="row" style="gap:8px"><a class="btn primary" style="flex:1;padding:0 12px" href="https://wa.me/?text=${encodeURIComponent(full)}" target="_blank" rel="noopener">WhatsApp</a><button class="btn" style="flex:1;padding:0 12px" data-act="copyShare">Copiar texto</button></div>
    <button data-act="closeSheet" style="background:none;border:0;font-weight:700;font-size:15px;color:var(--muted);min-height:44px;cursor:pointer">Cerrar</button>`);
  window.__share=full;
}
const brandRow=(dark)=>`<div class="row" style="align-self:stretch;gap:8px">${ico("cat",22,22,`style="color:var(--cat);--eye:${dark?"var(--ink)":"var(--bg)"}"`)}<b style="font-size:14px">Gato Encerrado</b></div>`;
function shareLevel(){
  const r=lastResult;if(!r)return;
  const card=`<div class="sharecard" style="background:var(--card);border:1px solid var(--line)">${brandRow()}<b style="font-size:40px;letter-spacing:-.05em;line-height:.95">Nivel ${r.n}</b><span style="font-size:16px;font-weight:700;background:var(--ink);color:var(--fish);border-radius:999px;padding:6px 14px">${victoryTitle(r.L)}</span>${starsHTML(r.stars,24)}<b style="font-size:24px;font-variant-numeric:tabular-nums">${fmt(r.sec)}</b><svg width="52" height="14" aria-label="VACH*"><use href="#vach"/></svg></div>`;
  const what=r.L===2?" y descubrí a los dos mentirosos":r.L===1?" y descubrí al mentiroso":"";
  shareSheet(card,`Resolví el nivel ${r.n} de Gato Encerrado en ${fmt(r.sec)}${what}. ${"★".repeat(r.stars)}${"☆".repeat(3-r.stars)}\n¿Lo resolvés más rápido?`);
}
function shareStage(si){
  si=+si;const st=STAGES[si],next=STAGES[si+1],count=st.to-st.from+1;
  const card=`<div class="sharecard" style="background:var(--fish)">${brandRow()}<div style="width:68px;height:68px;border-radius:50%;background:var(--ink);display:grid;place-items:center;box-shadow:0 0 0 5px var(--card)"><svg width="44" height="44" style="color:var(--cat);--eye:var(--ink)" aria-hidden="true"><use href="#cat-happy"/></svg></div><span class="eyebrow" style="color:var(--ink)">${next?"Nuevo rango":"Juego completo"}</span><b style="font-size:30px;letter-spacing:-.04em;line-height:1">${next?next.name:"Leyenda"}</b><span style="font-size:14px">${st.name} completa · ${stageStars(si)} de ${count*3} ★</span><svg width="52" height="14" aria-label="VACH*"><use href="#vach"/></svg></div>`;
  shareSheet(card,next?`¡Ascendí a ${next.name} en Gato Encerrado! Terminé la etapa ${st.name} con ${stageStars(si)} de ${count*3} estrellas.\n¿Te animás a desenmascarar a los gatos mentirosos?`:`¡Terminé los 150 niveles de Gato Encerrado! Soy Leyenda.\n¿Te animás a desenmascarar a los gatos mentirosos?`);
}
function shareDaily(){
  const r=save.daily.results[today()];if(!r)return;
  const P=dailyPuzzle(),cs=new Set(P.cats.map(c=>c[1]*P.n+c[0]));
  const mini=[...Array(P.n*P.n).keys()].map(i=>`<span style="aspect-ratio:1;border-radius:4px;background:${cs.has(i)?"var(--cat)":"#2A2A2A"}"></span>`).join("");
  const card=`<div class="sharecard" style="background:var(--ink);color:var(--bg)"><div class="row" style="align-self:stretch;gap:8px">${ico("cat",22,22,'style="color:var(--cat);--eye:var(--ink)"')}<b style="font-size:14px">Gato Encerrado</b><span style="margin-left:auto;font-size:12px;color:#AAAAAA">${shortDate()}</span></div><span class="eyebrow" style="color:var(--fish)">Desafío n.º ${dayIndex()+1}</span><div aria-hidden="true" style="width:84px;display:grid;grid-template-columns:repeat(${P.n},1fr);gap:3px">${mini}</div><b style="font-size:38px;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums">${fmt(r.t)}</b><span style="font-size:14px;color:#AAAAAA">${r.h?plural(r.h,"pista","pistas"):"Sin pistas"} · Racha de ${plural(streakNow(),"día","días")}</span><span style="font-size:15px;font-weight:700;background:var(--fish);color:var(--ink);border-radius:999px;padding:6px 14px">¿Me ganás?</span></div>`;
  shareSheet(card,`Gato Encerrado · Desafío n.º ${dayIndex()+1} (${shortDate()})\nLo resolví en ${fmt(r.t)}, ${r.h?`con ${plural(r.h,"pista","pistas")}`:"sin pistas"}. Racha de ${plural(streakNow(),"día","días")}.\n¿Me ganás?`);
}
function copyShare(btn){
  const done=()=>{btn.textContent="¡Copiado!";setTimeout(()=>{if(btn.isConnected)btn.textContent="Copiar texto"},1800)};
  const fallback=()=>{const el=$("shareText");if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent="Seleccionado"};
  try{navigator.clipboard.writeText(window.__share).then(done,fallback)}catch(e){fallback()}
}

/* ---------- Cómo se juega ---------- */
function renderHow(){
  app.innerHTML=`<main class="view" style="gap:14px"><div class="top"><button class="round" data-act="back" aria-label="Volver">${ico("back",18)}</button><h1>Cómo se juega</h1></div>
    <section class="card stack" style="gap:10px"><h2 style="font-size:16px">Poné los peces que pide el nivel</h2><div class="fishrow" style="justify-content:flex-start" aria-hidden="true"><svg viewBox="0 0 40 24" class="used"><use href="#fish"/></svg><svg viewBox="0 0 40 24"><use href="#fish"/></svg></div><p class="muted" style="font-size:14px;line-height:1.45">Arriba del tablero ves los peces que tenés que poner. Tocá una casilla para poner uno: arriba se apaga. Tocalo de nuevo para sacarlo.</p></section>
    <section class="card stack" style="gap:10px"><h2 style="font-size:16px">Los gatos son las pistas</h2>${miniHTML([C("→2"),F(1),F(1)])}<p class="muted" style="font-size:14px;line-height:1.45">Cada gato mira hacia su flecha, hasta el borde, y dice cuántos peces ve. Si dice 0, no ve ningún pez. Si dice 1, ve un pez. Donde hay un gato no va pez.</p></section>
    <section class="card stack" style="gap:10px"><div class="row" style="justify-content:space-between"><h2 style="font-size:16px">Alguno puede mentir</h2><span class="pill liar">Desde el nivel 11</span></div><p class="muted" style="font-size:14px;line-height:1.45">En muchos niveles uno de los gatos tiene un número falso (desde el nivel 101, dos). Poné los peces haciendo caso a los demás y tocá al mentiroso para acusarlo. El gato con corona nunca miente.</p></section>
    <section class="card stack" style="gap:10px"><h2 style="font-size:16px">Ayudas</h2>
      <div class="row"><span class="pill" style="min-width:56px;justify-content:center">Pista</span><span style="font-size:14px;line-height:1.4;color:var(--soft)">Te muestra un paso. Ganás pistas con 3 estrellas, con el desafío del día y al terminar cada etapa. Podés guardar hasta 5.</span></div>
      <div class="row"><span class="pill" style="min-width:56px;justify-content:center">${ico("bulb",18)}</span><span style="font-size:14px;line-height:1.4;color:var(--soft)">Lamparita: al pasar sobre un gato, marca lo que mira.</span></div>
      <div class="row"><span class="pill" style="min-width:56px;justify-content:center">${ico("x",14)}</span><span style="font-size:14px;line-height:1.4;color:var(--soft)">Cruz (desde el nivel 26): marcá dónde seguro no va un pez.</span></div></section>
  </main>`;
}
let backTo="home";

/* ---------- Ajustes ---------- */
function renderSettings(){
  const S=save.settings;
  app.innerHTML=`<main class="view" style="gap:18px"><div class="top"><button class="round" data-act="go" data-arg="home" aria-label="Volver al inicio">${ico("back",18)}</button><h1>Ajustes</h1></div>
    <section class="stack" style="gap:8px"><h2 class="eyebrow" style="margin:0 4px">Juego</h2><div class="list">
      <label for="setSound">Sonido<input id="setSound" class="sw" type="checkbox" role="switch" data-set="sound" ${S.sound?"checked":""}></label>
      <label for="setVib">Vibración<input id="setVib" class="sw" type="checkbox" role="switch" data-set="vib" ${S.vib?"checked":""}></label>
      <label for="setBulb"><span class="stack" style="gap:2px"><span>Lamparita siempre prendida</span><span class="muted" style="font-size:13px;font-weight:500">Marca lo que mira cada gato al pasar por encima</span></span><input id="setBulb" class="sw" type="checkbox" role="switch" data-set="bulb" ${S.bulb?"checked":""}></label>
    </div></section>
    <section class="stack" style="gap:8px"><h2 class="eyebrow" style="margin:0 4px">General</h2><div class="list">
      <button data-act="how">Cómo se juega${ico("chev",16,16,'style="color:var(--muted)"')}</button>
      <button data-act="go" data-arg="help">Ver los carteles de ayuda otra vez${ico("chev",16,16,'style="color:var(--muted)"')}</button>
    </div></section>
    <section class="stack" style="gap:8px"><h2 class="eyebrow" style="margin:0 4px">Progreso</h2>
      <div class="list"><button data-act="askReset" style="color:var(--bad)">Borrar mi progreso</button></div>
      <p class="muted" style="font-size:13px;line-height:1.45;margin:0 4px">Tu progreso se guarda en este navegador. Si borrás los datos del navegador o jugás en otro dispositivo, empezás de nuevo.</p></section>
    <div class="row mt-auto" style="justify-content:center;gap:8px;font-size:13px;color:var(--muted)">Un juego de <svg width="58" height="15" aria-label="VACH*" style="color:var(--ink)"><use href="#vach"/></svg></div>
  </main>`;
}
function askReset(){
  openSheet(heroSheet(`<span class="badge" style="width:64px;height:64px;border-radius:50%;background:var(--bad-bg);color:var(--bad)">${ico("trash",30)}</span>`,"¿Borrar todo tu progreso?",`Volvés al nivel 1 y perdés tus ${starsTotal()} estrellas, tus pistas y tu racha de ${plural(streakNow(),"día","días")}. Esto no se puede deshacer.`)+
    `<div class="stack"><button class="btn primary" data-act="closeSheet">Cancelar</button><button class="btn danger" data-act="doReset">Sí, borrar todo</button></div>`);
}

/* ---------- Bienvenida ---------- */
function renderWelcome(){
  app.innerHTML=`<main class="view" style="gap:28px;padding-top:56px">
    <div class="mini" style="grid-template-columns:repeat(3,76px)" role="img" aria-label="Un tablero de 3 por 3 con un gato que mira a la izquierda y dice 1, y un pez a su lado">
      <span style="height:76px"></span><span style="height:76px"></span><span style="height:76px"></span><span style="height:76px"></span><span style="height:76px"></span><span style="height:76px"></span>
      <span class="s" style="height:76px">${ico("fish",52,31)}</span><span class="c" style="height:76px"><svg class="f" viewBox="0 0 40 40" style="color:var(--cat);--eye:var(--cat-bg);width:36px"><use href="#cat"/></svg><b style="font-size:22px">←1</b></span><span style="height:76px"></span></div>
    <div class="hero" style="gap:12px"><h1 style="font-size:34px;line-height:1.05">Los gatos saben dónde están los peces</h1><p class="muted" style="font-size:16px;line-height:1.5;max-width:300px">Cada gato te dice cuántos peces ve. Escuchalos y encontralos todos. Pero cuidado: alguno puede mentir.</p></div>
    <div class="stack mt-auto"><button class="btn primary" data-act="welcomeGo">Empezar ${ico("arrow",18,18,'style="color:var(--fish)"')}</button><span class="center muted" style="font-size:13px">El primer nivel se resuelve con un solo toque.</span></div>
  </main>`;
}

/* ---------- acciones ---------- */
const ACT={
  noop(){},
  go(a){go(a)},
  back(){go(backTo||"home")},
  how(){backTo="settings";go("how")},
  play(a){go("game",+a)},
  closeSheet(){closeSheet()},
  exitGame(){exitGame()},
  resetBoard(){if(!G||G.done)return;G.cells=G.cells.map((v,i)=>G.locked.has(i)?1:0);G.accused=[];G.crossMode=false;setStatus("Tablero limpio. El reloj sigue corriendo.");renderBoard()},
  hint(){hint()},
  toggleCross(){if(!G)return;G.crossMode=!G.crossMode;setStatus(G.crossMode?"Modo cruz: tocá las casillas donde no va un pez.":"");renderBoard()},
  toggleBulb(){if(!G)return;G.bulb=!G.bulb;G.hover=-1;renderBoard()},
  introOk(k,btn){if(btn&&btn.disabled)return;save.seen[k]=1;persist();tut=null;closeSheet();if(G){G.paused=false;setTimeout(()=>showTag(k),150)}},
  tutTap(a){tutTap(+a)},
  toggleStage(a){openStage=openStage===+a?-1:+a;renderLevels()},
  lockedLevel(a){const n=current(),k=+a;lockedSheet(`El nivel ${k} todavía está cerrado`,`Los niveles se abren de a uno. Te ${k-n===1?"falta 1":"faltan "+(k-n)} para llegar: seguí por el nivel ${n}.`)},
  lockedStage(a){const st=STAGES[+a],n=current();lockedSheet(`${st.name} todavía está cerrada`,`Se abre en el nivel ${st.from}. Te ${st.from-n===1?"falta 1 nivel":"faltan "+(st.from-n)+" niveles"}: seguí por el nivel ${n}.`)},
  stageEnd(a){go("stage",a)},
  shareLevel(){shareLevel()},shareStage(a){shareStage(a)},shareDaily(){shareDaily()},
  copyShare(a,btn){copyShare(btn)},
  helpCard(a){helpCard(+a)},
  reseen(){save.seen={};persist();const b=document.querySelector('[data-act="reseen"]');if(b)b.textContent="Listo: vuelven a aparecer"},
  askReset(){askReset()},
  doReset(){const s=save.settings;save=blank();save.settings=s;save.welcomed=0;persist();openStage=null;go("welcome")},
  welcomeGo(){save.welcomed=1;persist();go("game",1)}
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t)return;const f=ACT[t.dataset.act];if(f){e.preventDefault();f(t.dataset.arg,t,e)}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset&&t.dataset.set){save.settings[t.dataset.set]=t.checked?1:0;persist();if(t.dataset.set==="sound"&&t.checked)beep([523],.06);if(t.dataset.set==="vib"&&t.checked)buzz(20)}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("sheetRoot").innerHTML){const s=$("sheetRoot").querySelector('.scrim[data-act="closeSheet"]');if(s)closeSheet();return}
  if(view!=="game"||!G||$("sheetRoot").innerHTML)return;
  if(!e.target.closest||!e.target.closest(".board"))return;
  const n=G.n;let f=G.focus;
  if(e.key==="ArrowRight")f=f%n<n-1?f+1:f;else if(e.key==="ArrowLeft")f=f%n>0?f-1:f;
  else if(e.key==="ArrowDown")f=f+n<G.N?f+n:f;else if(e.key==="ArrowUp")f=f-n>=0?f-n:f;
  else if(e.key===" "||e.key==="Enter"){e.preventDefault();G.catAt[f]>=0?tapCat(G.catAt[f]):tapCell(f,1);$("c"+f).focus();return}
  else if((e.key==="x"||e.key==="X")&&hasCross()&&G.catAt[f]<0){tapCell(f,2);$("c"+f).focus();return}
  else return;
  e.preventDefault();G.focus=f;renderBoard();$("c"+f).focus();
});

/* ---------- arranque ---------- */
function boot(){
  if(!save.welcomed)go("welcome");else go("home");
  const sp=$("splash");setTimeout(()=>{sp.classList.add("out");setTimeout(()=>sp.remove(),400)},900);
}
boot();
})();
</script>
