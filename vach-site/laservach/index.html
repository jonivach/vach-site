<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaserVach — Grabado Láser en Vivo · VACH*</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:  #0A0A0A;
      --teal:   #1CC4A0;
      --white:  #FFFFFF;
      --gray:   #888;
      --lgray:  #AAAAAA;
      --border: rgba(255,255,255,0.08);
    }

    html, body {
      height: 100%;
      font-family: 'Space Grotesk', sans-serif;
      background: var(--black);
      color: var(--white);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    .bg {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 20% 20%, rgba(28,196,160,0.16) 0%, transparent 60%),
                  radial-gradient(ellipse 60% 50% at 80% 80%, rgba(28,196,160,0.08) 0%, transparent 55%),
                  #0A0A0A;
    }
    .grid-overlay {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
    }
    .layout {
      position: relative; z-index: 2;
      height: 100vh;
      display: flex; flex-direction: column;
      justify-content: space-between;
      padding: 2rem 2.5rem;
    }
    nav { display: flex; align-items: center; justify-content: space-between; }
    .back { font-size: 0.8rem; font-weight: 600; color: var(--gray); text-decoration: none; display: flex; align-items: center; gap: 0.4rem; transition: color 0.2s; }
    .back:hover { color: var(--white); }
    .logo { text-decoration: none; display: flex; align-items: center; }
    .logo img { height: 24px; width: auto; display: block; }
    .content { text-align: center; }
    .label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--teal); margin-bottom: 1rem; }
    h1 { font-size: clamp(3rem, 8vw, 7rem); font-weight: 700; line-height: 0.95; letter-spacing: -0.025em; margin-bottom: 1.5rem; }
    h1 em { font-style: normal; color: var(--teal); }
    .soon {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: rgba(28,196,160,0.15);
      border: 1px solid rgba(28,196,160,0.3);
      border-radius: 100px;
      padding: 0.5rem 1.25rem;
      font-size: 0.8rem; font-weight: 600;
      color: var(--teal); margin-bottom: 1.5rem;
    }
    .soon .pulse {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--teal);
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(28,196,160,0.4); }
      50%      { box-shadow: 0 0 0 6px rgba(28,196,160,0); }
    }
    p { font-size: 1rem; color: var(--lgray); max-width: 400px; margin: 0 auto 2.5rem; line-height: 1.65; }
    .back-link { display: block; margin-top: 0.5rem; font-size: 0.82rem; color: var(--gray); text-decoration: none; transition: color 0.2s; }
    .back-link:hover { color: var(--white); }
    footer { text-align: center; font-size: 0.72rem; color: var(--gray); }
  </style>
</head>
<body>
<div class="bg"></div>
<div class="grid-overlay"></div>
<div class="layout">
  <nav>
    <a href="/" class="back">← Volver</a>
    <a href="/" class="logo"><img src="/logo.png" alt="VACH*" /></a>
  </nav>
  <div class="content">
    <div class="soon"><span class="pulse"></span> Próximamente</div>
    <p class="label">↗ LaserVach</p>
    <h1>Grabado láser<br><em>en vivo.</em></h1>
    <p>Diseñá tu producto y grabalo con láser en tiempo real durante tu evento. Una propuesta para activaciones sociales, corporativas y de marca.</p>
    <a href="https://www.instagram.com/vach.arg/" target="_blank" class="back-link">Seguinos en @vach.arg para novedades</a>
  </div>
  <footer>© 2026 VACH* · Buenos Aires, Argentina</footer>
</div>
</body>
</html>
