<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>404 · VACH*</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Microsoft Clarity -->
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
      c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
      t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
      y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window,document,"clarity","script","x4zb3rb3a2");
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: 'Space Grotesk', sans-serif;
      background: #0A0A0A;
      color: #fff;
      height: 100%;
      -webkit-font-smoothing: antialiased;
    }

    .bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 10% 10%, rgba(245,200,0,0.10) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 90% 90%, rgba(245,200,0,0.06) 0%, transparent 50%),
        #0A0A0A;
      z-index: 0;
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
    }

    .wrap {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      gap: 1.5rem;
    }

    .logo {
      height: 28px;
      width: auto;
      opacity: 0.9;
      margin-bottom: 1rem;
    }

    .code {
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      color: #F5C800;
      opacity: 0.15;
      user-select: none;
    }

    h1 {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: -1rem;
    }

    p {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.5);
      max-width: 340px;
      line-height: 1.6;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
      padding: 0.75rem 1.75rem;
      background: #F5C800;
      color: #0A0A0A;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 100px;
      letter-spacing: 0.01em;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid-overlay"></div>
  <div class="wrap">
    <img src="/logo.png" alt="VACH*" class="logo" />
    <div class="code">404</div>
    <h1>Página no encontrada</h1>
    <p>La página que buscás no existe o fue movida. Volvé al inicio y seguí explorando.</p>
    <a href="/" class="btn">← Volver al inicio</a>
  </div>
</body>
</html>
